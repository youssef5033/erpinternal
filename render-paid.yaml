# PAID alternative (about US$14/month): web service + Render PostgreSQL + a disk
# for documents. The default render.yaml is the free setup. To use this file,
# set "Blueprint Path" to render-paid.yaml when creating the Blueprint.
# See docs/DEPLOY.md for costs, first login and switching to real use.
services:
  - type: web
    name: agency-erp
    runtime: node
    plan: starter # persistent disks need a paid instance
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations and reference data on every deploy; loads the demo
    # data set only into an empty database while APP_ENV=demo.
    # 512 MB instance: the server is started directly (not via `npm start`, saving ~80 MB)
    # with a capped JavaScript heap so memory is reclaimed well before the limit. The cap
    # is on the start command only, so the build keeps its full memory.
    startCommand: npm run db:setup -- --seed-demo-if-empty && node --max-old-space-size=256 node_modules/next/dist/bin/next start
    healthCheckPath: /api/health
    disk:
      name: documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: agency-erp-db
          property: connectionString
      - key: APP_ENV
        value: demo # change to "production" for real use (see docs/DEPLOY.md)
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true # random 256-bit value, base64
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/storage
      - key: JOBS_IN_WEB
        value: "true"
      - key: DEMO_PASSWORD
        sync: false # Render asks for it when the Blueprint is created; choose a strong one

databases:
  - name: agency-erp-db
    databaseName: agency_erp_demo
    user: agency_erp
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: [] # reachable only from your Render services, not the internet
